<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="halftone" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="11" cy="11" r="4.2" fill="#FFD400"/>
    </pattern>
    <pattern id="halftonePink" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <circle cx="9" cy="9" r="2.6" fill="#FF2E88"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mHalf"><rect x="880" y="0" width="560" height="520" fill="url(#fadeR)"/></mask>
    <mask id="mHalfPink"><rect x="0" y="560" width="520" height="340" fill="url(#fadeD)" transform="rotate(180 260 730)"/></mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD400" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sunburst rays, bottom-left -->
  <g transform="translate(-40 940)" fill="#FFD400" fill-opacity="0.10">
    <polygon points="0,0 1500,-120 1500,-40"/>
    <polygon points="0,0 1500,-360 1500,-260"/>
    <polygon points="0,0 1400,-640 1500,-560"/>
    <polygon points="0,0 900,-940 1060,-940"/>
    <polygon points="0,0 380,-940 520,-940"/>
  </g>

  <!-- yellow glow top-right -->
  <circle cx="1240" cy="140" r="360" fill="url(#glow)"/>

  <!-- halftone field top-right -->
  <rect x="880" y="0" width="560" height="520" fill="url(#halftone)" mask="url(#mHalf)" opacity="0.55"/>

  <!-- pink halftone bottom-left -->
  <rect x="0" y="560" width="520" height="340" fill="url(#halftonePink)" mask="url(#mHalfPink)" opacity="0.5"/>

  <!-- diagonal stripe band (jumpsuit) -->
  <g transform="translate(720 640) rotate(-28)">
    <rect x="-1100" y="-70" width="2400" height="34" fill="#0b0b0b"/>
    <rect x="-1100" y="-36" width="2400" height="46" fill="#FFD400"/>
    <rect x="-1100" y="10" width="2400" height="14" fill="#0b0b0b"/>
    <rect x="-1100" y="24" width="2400" height="10" fill="#FF2E88"/>
    <rect x="-1100" y="34" width="2400" height="34" fill="#0b0b0b"/>
    <rect x="-1100" y="68" width="2400" height="26" fill="#FFD400"/>
  </g>

  <!-- thin pink slash -->
  <g transform="translate(300 180) rotate(-28)">
    <rect x="-900" y="0" width="2400" height="6" fill="#FF2E88" opacity="0.85"/>
  </g>

  <!-- film-strip perforations, left edge -->
  <g fill="#FFD400" fill-opacity="0.35">
    <rect x="14" y="30" width="14" height="22" rx="3"/>
    <rect x="14" y="70" width="14" height="22" rx="3"/>
    <rect x="14" y="110" width="14" height="22" rx="3"/>
    <rect x="14" y="150" width="14" height="22" rx="3"/>
    <rect x="14" y="190" width="14" height="22" rx="3"/>
    <rect x="14" y="230" width="14" height="22" rx="3"/>
    <rect x="14" y="270" width="14" height="22" rx="3"/>
    <rect x="14" y="310" width="14" height="22" rx="3"/>
    <rect x="14" y="350" width="14" height="22" rx="3"/>
    <rect x="14" y="390" width="14" height="22" rx="3"/>
    <rect x="14" y="430" width="14" height="22" rx="3"/>
    <rect x="14" y="470" width="14" height="22" rx="3"/>
  </g>

  <!-- bold circle target, top-right corner -->
  <g fill="none" stroke="#0b0b0b" stroke-opacity="0.9">
    <circle cx="1330" cy="110" r="70" stroke-width="10"/>
    <circle cx="1330" cy="110" r="40" stroke-width="6" stroke="#FF2E88"/>
  </g>
  <circle cx="1330" cy="110" r="14" fill="#FFD400"/>
</svg>
